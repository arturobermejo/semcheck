name: semcheck

# Only by hand, from the Actions tab: the model gives answers that move a few
# hundredths from one request to the next, and a build must not turn red for
# that. It is also the example for a project that already runs golangci-lint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # semcheck checks its own code with the rules of .semcheck.yml, the way a
  # project that already runs golangci-lint would: as one more linter, with its
  # findings in the code scanning of GitHub.
  semcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the report
    env:
      # Empty where the secret is not set, as in a fork: the steps that need it
      # are skipped, instead of failing.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A cache of GitHub never changes once saved, so every run saves one of
      # its own, and restores the latest: a run only asks the model about the
      # code that is new to all the runs before it.
      - name: Restore the decisions of earlier runs
        if: env.TYPESAFE_API_KEY != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/semcheck
          key: semcheck-${{ github.run_id }}
          restore-keys: semcheck-

      # The action finds .custom-gcl.yml and builds the golangci-lint that has
      # semcheck inside. Without the cache of golangci-lint: it does not know
      # when .semcheck.yml changes, and would serve the findings of the old one.
      - name: Run semcheck
        if: env.TYPESAFE_API_KEY != ''
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --config=.golangci.semcheck.yml --output.text.path=stdout --output.sarif.path=semcheck.sarif
          skip-cache: true

      # Also when there are findings, which fail the step above.
      - name: Upload the report
        if: ${{ !cancelled() && hashFiles('semcheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semcheck.sarif
          category: semcheck
