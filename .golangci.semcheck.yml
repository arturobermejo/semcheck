# Configuration for ./custom-gcl, the golangci-lint build that includes
# semcheck (see .custom-gcl.yml). It needs TYPESAFE_API_KEY in the environment,
# or SEMCHECK_JUDGE=fake:0.95 to run without a model. The stock golangci-lint
# does not know this linter, which is why it is kept out of .golangci.yml.
version: "2"

linters:
  default: none
  enable:
    - semcheck
  settings:
    custom:
      semcheck:
        type: module
        description: Natural-language rules checked on exact AST nodes.
        settings:
          # Or "rules:", with the rules right here: golangci-lint then knows
          # when they change, and does not serve stale results from its cache.
          config: cmd/semcheck/testdata/.semcheck.yml

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # golangci-lint keeps one issue per linter and line. To it all the rules of
  # semcheck are one linter: without this, two rules that find something on the
  # same line would show as one.
  uniq-by-line: false
